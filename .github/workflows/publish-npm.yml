name: MidManStudio.Qr — WASM npm publish

# Manual only (Actions tab -> Run workflow) — requires typing "publish" in
# the confirmation input.
#
# ── Before the very first run ───────────────────────────────────────────
# For @midmanstudio/mid-qr:
#   1. Trusted publishing is configured on npmjs.com under:
#      Package Settings -> Trusted Publisher.
#   2. Initial release (v1.0.0) must be published once manually from local:
#      `npm login` -> `npm publish --access public` inside `npm/`.
#   3. Trusted Publisher Config:
#      - GitHub Actions
#      - Owner: "MidManStudio"
#      - Repo: "mid_qr_code_lib"
#      - Workflow filename: "qr-npm-publish.yml"
#   4. Subsequent releases authenticate via OIDC automatically.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm. Bump version in npm/package.json first if this is a new release.'
        required: true

permissions:
  contents: write
  packages: write
  id-token: write
  actions: read

jobs:

  # ── 1. Confirm trigger ─────────────────────────────────────────────────
  confirm-trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm manual trigger
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "publish" ]; then
            echo "Confirmation text did not match 'publish' — aborting."
            exit 1
          fi

  # ── 2. Build, test, and publish ────────────────────────────────────────
  build-test-and-publish:
    runs-on: ubuntu-latest
    needs: confirm-trigger
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ubuntu-latest-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-latest-cargo-wasm-

      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack &> /dev/null; then
            curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          fi
          wasm-pack --version

      # ── Verify directory structure ─────────────────────────────────────
      - name: Validate npm directory and package.json
        run: |
          if [ ! -d "npm" ]; then
            echo "::error::Directory 'npm' does not exist in repo root."
            exit 1
          fi
          if [ ! -f "npm/package.json" ]; then
            echo "::error::File 'npm/package.json' not found. Ensure package.json is committed in 'npm/'."
            exit 1
          fi
          echo "Found npm/package.json successfully."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm supports OIDC trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: npm install
        working-directory: npm

      # ── Runs build:wasm, build:ts, and build:worker ─────────────────────
      - name: Build package
        run: npm run build
        working-directory: npm

      - name: Run test suite
        run: npm test
        working-directory: npm

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mid-qr-npm-build-${{ github.run_number }}
          path: |
            npm/dist/
            npm/wasm/
            npm/worker/
            npm/package.json
          retention-days: 30

      # ── Dry Run Verification ───────────────────────────────────────────
      - name: Verify npm package (dry run)
        run: npm publish --access public --dry-run
        working-directory: npm

      # ── Publish to npmjs.org (OIDC Trusted Publishing) ───────────────
      - name: Publish to npm
        run: npm publish --access public
        working-directory: npm

      # ── Mirror to GitHub Packages ──────────────────────────────────────
      - name: Compute GitHub Packages scope
        id: gh_scope
        run: |
          set -euo pipefail
          echo "scope=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          registry-url: 'https://npm.pkg.github.com'
          scope: '@${{ steps.gh_scope.outputs.scope }}'

      - name: Publish mirror to GitHub Packages
        id: gh_packages_publish
        continue-on-error: true
        run: |
          set -euo pipefail
          npm pkg set name="@${{ steps.gh_scope.outputs.scope }}/mid-qr"
          npm publish
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Note GitHub Packages mirror outcome
        if: always()
        run: |
          if [ "${{ steps.gh_packages_publish.outcome }}" == "success" ]; then
            echo "GitHub Packages mirror published successfully."
          else
            echo "::warning::GitHub Packages mirror publish failed — npmjs.org publish unaffected."
          fi

      # ── GitHub Release ──────────────────────────────────────────────────
      - name: Read package version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Published @midmanstudio/mid-qr v$VERSION"
        working-directory: npm

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "@midmanstudio/mid-qr v${{ steps.version.outputs.version }}" \
            --notes "@midmanstudio/mid-qr v${{ steps.version.outputs.version }} published to npm." \
            --target "${{ github.sha }}"

  # ── 3. Summary ─────────────────────────────────────────────────────────
  summary:
    runs-on: ubuntu-latest
    needs: [confirm-trigger, build-test-and-publish]
    if: always()
    steps:
      - name: Print summary
        run: |
          echo "============================================="
          echo "  @midmanstudio/mid-qr — Build Summary"
          echo "============================================="
          echo "Build:          #${{ github.run_number }}"
          echo "Branch:         ${{ github.ref_name }}"
          echo "Build/Publish:  ${{ needs.build-test-and-publish.result || 'skipped' }}"
          echo ""
          echo "npm Package: https://www.npmjs.com/package/@midmanstudio/mid-qr"
