name: Publish to npm

# ── OIDC trusted publishing ─────────────────────────────────────────────
# This workflow runs manually. It reads the version from npm/package.json,
# builds the Rust/WASM/TS code, publishes it to npm via OIDC Trusted 
# Publishing, and then automatically pushes a matching Git tag to GitHub.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.get_ver.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from package.json
        id: get_ver
        run: |
          VERSION=$(node -p "require('./npm/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Preparing build for version: $VERSION"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Run mid-qr-core tests
        run: cargo test -p mid-qr-core --features generate,decode

      - name: Build WASM (release, web target)
        run: |
          wasm-pack build crates/mid-qr-wasm \
            --target web \
            --release \
            --out-dir ../../npm/wasm \
            --out-name mid_qr_wasm

      - name: Install binaryen (wasm-opt)
        run: |
          sudo apt-get install -y binaryen
          wasm-opt --version

      - name: Optimise WASM with full proposal support
        run: |
          wasm-opt npm/wasm/mid_qr_wasm_bg.wasm \
            -Oz \
            --enable-bulk-memory \
            --enable-nontrapping-float-to-int \
            --enable-sign-ext \
            --enable-mutable-globals \
            -o npm/wasm/mid_qr_wasm_bg.wasm
          echo "wasm-opt done ($(du -sh npm/wasm/mid_qr_wasm_bg.wasm | cut -f1))"

      - name: Verify WASM artefacts
        run: |
          for f in npm/wasm/mid_qr_wasm_bg.wasm npm/wasm/mid_qr_wasm.js npm/wasm/mid_qr_wasm.d.ts; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing: $f"
              exit 1
            fi
            echo "OK $f ($(du -sh "$f" | cut -f1))"
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install and build
        working-directory: npm
        run: |
          npm install
          npm run build:ts
          npm run build:worker

      - name: Verify TS + worker build output
        run: |
          for f in npm/dist/index.js npm/dist/index.d.ts npm/worker/qr-scanner.min.js npm/worker/qr-scanner-worker.min.js; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing: $f"
              exit 1
            fi
            echo "OK $f"
          done

      - name: Upload npm package artefact
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: |
            npm/dist/
            npm/wasm/
            npm/worker/
            npm/package.json
            npm/README.md
            LICENSE
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Required to push the git tag back to the repo
      id-token: write   # Required for OIDC trusted publishing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm supports OIDC trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Download npm package artefact
        uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: npm-publish/

      - name: Verify publish layout
        run: |
          echo "Publish contents:"
          find npm-publish -type f | sort

      - name: Verify npm package (dry run)
        working-directory: npm-publish
        run: npm publish --access public --dry-run

      - name: Publish to npm
        working-directory: npm-publish
        run: npm publish --access public 

      - name: Tag the release in GitHub
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"
          echo "Successfully tagged and pushed v$VERSION to GitHub."
